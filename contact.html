<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Mai</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">Mai.</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html#about" class="nav-link">About me</a></li>
      <li><a href="index.html#works" class="nav-link">Works</a></li>
      <li><a href="index.html#skills" class="nav-link">Skills</a></li>
      <li><a href="contact.html" class="nav-link">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Page Header -->
  <section id="contact-hero">
    <div class="hero-dot" style="width:160px;height:160px;top:-40px;right:60px;"></div>
    <div class="hero-dot" style="width:70px;height:70px;bottom:20px;right:220px;"></div>
    <div class="container">
      <p class="hero-eyebrow fade-in">お問い合わせ</p>
      <h1 class="hero-title fade-in" style="transition-delay:0.1s">
        Let's work<br><span>together.</span>
      </h1>
      <p class="hero-desc fade-in" style="transition-delay:0.2s">
        お仕事のご相談・ご依頼など、お気軽にご連絡ください。<br>
        2〜3営業日以内に返信いたします。
      </p>
    </div>
  </section>

  <!-- Form -->
  <section id="contact-form">
    <div class="container">
      <div class="form-wrap fade-in">

        <form id="contact-form-el" action="https://formspree.io/f/xnjrngyw" method="POST">

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="name">お名前 <span class="required">*</span></label>
              <input class="form-input" type="text" id="name" name="name" placeholder="山田 太郎" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="email">メールアドレス <span class="required">*</span></label>
              <input class="form-input" type="email" id="email" name="email" placeholder="hello@example.com" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="type">お問い合わせ種別 <span class="required">*</span></label>
            <div class="select-wrap">
              <select class="form-input form-select" id="type" name="type" required>
                <option value="" disabled selected>選択してください</option>
                <option value="project">お仕事のご依頼</option>
                <option value="consult">ご相談</option>
                <option value="other">その他</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="message">メッセージ <span class="required">*</span></label>
            <textarea class="form-input form-textarea" id="message" name="message" placeholder="ご用件をご記入ください" required></textarea>
          </div>

          <button type="submit" class="btn btn-submit" id="submit-btn">
            送信する
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
          <p class="form-note">2〜3営業日以内に返信いたします。</p>

        </form>

      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Mai. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
